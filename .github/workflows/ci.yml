name: RSI v0 conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.15.0'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/generate_fixtures.py --check
      - run: python tools/validate-fixtures.py
      - run: python -m rsi.run --output artifacts/baseline.json
      - run: python -m unittest discover -s tests -v
      - run: python -O -m unittest discover -s tests -v
      - run: python tools/prove_can_fail.py --output artifacts/prove-can-fail.json
      - run: python tools/check_expectations.py
      - run: python tools/prove_expectations_can_fail.py --output artifacts/expectation-mutations.json
      - run: python -m runner.extension_runtime --output artifacts/extension.json
      - run: python tools/run_registered_mutations.py --output artifacts/registered-mutations.json
      - run: python tools/check_extension_contract.py --mutations artifacts/registered-mutations.json --output artifacts/extension-validation.json
      - run: python -m runner.relation_runtime --output artifacts/relations.json
      - run: python tools/prove_relations_can_fail.py --output artifacts/relation-mutations.json
      - run: python tools/check_relation_contract.py --legacy-mutations artifacts/registered-mutations.json --relation-mutations artifacts/relation-mutations.json --output artifacts/relation-contract-check.json
      - run: python tools/run_crystal_receipt.py --output artifacts/crystal-receipt.json
      - run: python tools/prove_crystal_can_fail.py --output artifacts/crystal-mutations.json
      - run: python tools/check_crystal_receipt.py --mutations artifacts/crystal-mutations.json --output artifacts/crystal-validation.json
