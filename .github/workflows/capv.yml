name: CAPV expiry generation conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.15.0'
      - run: python -m pip install -r requirements-dev.txt
      - run: |
          mkdir -p artifacts/capv-phase3e/runtime
          cp evidence/capv/package*.json artifacts/capv-phase3e/runtime/
          npm ci --prefix artifacts/capv-phase3e/runtime
          node evidence/capv/compile.cjs
          node evidence/capv/build.cjs
          git diff --exit-code -- evidence/capv
      - run: python -m unittest tests.test_capv -v
      - run: python -O -m unittest tests.test_capv -v
      - run: python tools/run_capv.py --include-previous --output artifacts/capv.json
      - run: python tools/run_capv.py --include-previous --output artifacts/capv-rerun.json
      - run: cmp artifacts/capv.json artifacts/capv-rerun.json
      - run: python tools/prove_capv_can_fail.py --output artifacts/capv-mutations.json
