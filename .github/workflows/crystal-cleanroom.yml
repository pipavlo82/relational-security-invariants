name: Crystal clean-room third leg
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.15.0'
      - run: |
          for input in reproducers/crystal-receipt-cleanroom/inputs/*.json; do
            node reproducers/crystal-receipt-cleanroom/reproduce.mjs < "$input"
          done
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest tests.test_crystal_cleanroom -v
      - run: python -O -m unittest tests.test_crystal_cleanroom -v
      - run: python tools/check_crystal_cleanroom.py --output artifacts/h2-first.json
      - run: python tools/check_crystal_cleanroom.py --output artifacts/h2-second.json
      - run: cmp artifacts/h2-first.json artifacts/h2-second.json
