name: ERC8312 aggregate budget conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.15.0'
      - run: python -m pip install -r requirements-dev.txt
      - run: |
          mkdir -p artifacts/aggregate-phase3f/runtime
          cp evidence/aggregate/package*.json artifacts/aggregate-phase3f/runtime/
          npm ci --prefix artifacts/aggregate-phase3f/runtime
          node evidence/aggregate/compile.cjs
          node evidence/aggregate/build.cjs
          git diff --exit-code -- evidence/aggregate
      - run: python -m unittest tests.test_aggregate -v
      - run: python -O -m unittest tests.test_aggregate -v
      - run: python tools/run_aggregate.py --include-previous --output artifacts/aggregate.json
      - run: python tools/run_aggregate.py --include-previous --output artifacts/aggregate-rerun.json
      - run: cmp artifacts/aggregate.json artifacts/aggregate-rerun.json
      - run: python tools/prove_aggregate_can_fail.py --output artifacts/aggregate-mutations.json
