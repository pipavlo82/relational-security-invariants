name: TAS verified context invocation conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest tests.test_tas -v
      - run: python -O -m unittest tests.test_tas -v
      - run: python tools/run_tas_context_invocation.py --include-previous --output artifacts/tas-combined.json
      - run: python tools/prove_tas_can_fail.py --output artifacts/tas-mutations.json
      - run: python tools/check_tas_context_invocation.py --output artifacts/tas-validation.json
